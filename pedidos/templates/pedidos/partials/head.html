{% load static %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo|default:"Chester’s | Pasteles para perritos" }}</title>
  <meta name="description" content="{{ descripcion|default:'Pasteles para el cumpleaños de tu perrito, horneados en casa por la familia de Chester y aprobados por Melloco, su Director de Calidad.' }}">
  <link rel="canonical" href="{{ url_canonica }}">
  <meta name="theme-color" content="#FAFAF9">
  <link rel="icon" type="image/png" href="{% static 'pedidos/img/favicon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'pedidos/img/chester-avatar.jpg' %}">

  {# Vista previa al compartir el enlace (WhatsApp, Facebook, X). #}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Chester’s">
  <meta property="og:locale" content="es_EC">
  <meta property="og:url" content="{{ url_canonica }}">
  <meta property="og:title" content="{{ titulo|default:'Chester’s | Pasteles para perritos' }}">
  <meta property="og:description" content="{{ og_descripcion|default:'Horneamos en casa el pastel de cumpleaños de tu perrito.' }}">
  <meta property="og:image" content="{{ og_imagen }}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1000">
  <meta property="og:image:height" content="914">
  <meta property="og:image:alt" content="Chester, un schnauzer con collar rojo, frente a su pastel con forma de huesito.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'pedidos/css/chesters.css' %}">
  {# htmx 2.0.4 servido desde nuestros estáticos. La respuesta 429 (límite de envíos) también se pinta. #}
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"429","swap":true,"error":false},{"code":"[45]..","swap":false,"error":true}]}'>
  <script src="{% static 'pedidos/js/htmx.min.js' %}" defer></script>

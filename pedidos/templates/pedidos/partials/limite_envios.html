{# Aviso cuando una misma conexión supera el límite de envíos (views.LimiteEnvios). #}
<div class="mt-6 rounded-2xl border border-collar-200 bg-collar-50 px-5 py-4 text-sm leading-relaxed text-slate-700" role="alert">
  <p class="font-bold text-slate-900">Recibimos varios envíos seguidos desde tu conexión.</p>
  <p class="mt-1">Espera unos minutos y vuelve a intentarlo, o escríbele directo a Melloco por
    <a href="https://wa.me/{{ whatsapp }}" target="_blank" rel="noopener" class="font-bold text-collar-700 underline underline-offset-2">WhatsApp</a>.</p>
</div>

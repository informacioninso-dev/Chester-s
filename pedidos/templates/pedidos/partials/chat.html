{% load static %}
{# Chat de pedidos con Melloco (spec 005): botón flotante + panel. Lo abre y cierra el script de index.html. #}
<div class="fixed bottom-4 right-4 z-40 flex flex-col items-end gap-3 sm:bottom-6 sm:right-6">
  <section id="chat-panel" aria-labelledby="chat-titulo"
           class="hidden h-[min(36rem,calc(100dvh-6.5rem))] w-[calc(100vw-2rem)] max-w-sm flex-col overflow-hidden rounded-3xl bg-white shadow-2xl shadow-slate-900/20 ring-1 ring-black/5">
    <header class="flex items-center gap-3 bg-slate-900 px-4 py-3 text-white">
      <picture><source type="image/webp" srcset="{% static 'pedidos/img/chester-avatar-96.webp' %}"><img src="{% static 'pedidos/img/chester-avatar.jpg' %}" alt="" width="40" height="40" class="h-10 w-10 rounded-full bg-crema ring-2 ring-white/20"></picture>
      <div class="leading-tight">
        <h2 id="chat-titulo" class="font-display text-lg font-medium">Melloco</h2>
        <p class="text-xs text-stone-300">Te ayuda a pedir su pastel</p>
      </div>
      <button type="button" data-chat-cerrar aria-label="Cerrar el chat"
              class="ml-auto grid h-10 w-10 place-items-center rounded-full text-stone-300 transition hover:bg-white/10 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/60">
        <svg class="h-5 w-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
      </button>
    </header>
    <div id="chat-cuerpo" class="flex min-h-0 flex-1 flex-col">
      {% include "pedidos/partials/chat_inicio.html" %}
    </div>
  </section>

  <button type="button" id="chat-abrir" aria-controls="chat-panel" aria-expanded="false"
          class="inline-flex items-center gap-2.5 rounded-full bg-collar-600 py-3.5 pl-4 pr-5 font-extrabold text-white shadow-xl shadow-collar-600/30 transition hover:-translate-y-0.5 hover:bg-collar-700 focus:outline-none focus-visible:ring-4 focus-visible:ring-collar-600/30">
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.8A8 8 0 1 1 21 12Z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01" stroke-width="2.6"/></svg>
    <span data-chat-texto>Pedir por chat</span>
  </button>
</div>

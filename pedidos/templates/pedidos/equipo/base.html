{% load static %}<!doctype html>
<html lang="es" class="scroll-pt-20">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block titulo %}Pedidos{% endblock %} · Equipo de Chester’s</title>
  <meta name="theme-color" content="#0F172A">
  <link rel="icon" type="image/png" href="{% static 'pedidos/img/favicon.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'pedidos/css/chesters.css' %}">
  <script src="{% static 'pedidos/js/htmx.min.js' %}" defer></script>
</head>
<body class="min-h-dvh bg-stone-50 font-sans text-slate-900 antialiased" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <a href="#contenido" class="sr-only rounded-full bg-slate-900 px-5 py-3 font-bold text-white focus:not-sr-only focus:fixed focus:left-4 focus:top-3 focus:z-50">Saltar al contenido</a>
  {% block cabecera %}
  <header class="sticky top-0 z-30 bg-slate-900 text-white">
    <div class="mx-auto flex h-16 max-w-3xl items-center justify-between gap-3 px-4 sm:px-6">
      <a href="{% url 'pedidos:equipo' %}" class="flex min-w-0 items-center gap-3 py-2">
        <img src="{% static 'pedidos/img/melloco.svg' %}" alt="" width="36" height="36" class="h-9 w-9 shrink-0 rounded-full bg-crema-50 ring-2 ring-white/20">
        <span class="truncate font-display text-lg font-medium"><span translate="no">Chester’s</span> · Equipo</span>
      </a>
      <form method="post" action="{% url 'pedidos:equipo_salir' %}" class="flex shrink-0 items-center gap-3">
        {% csrf_token %}
        <span class="hidden text-sm text-stone-300 sm:inline">{{ request.user.get_full_name|default:request.user.username }}</span>
        <button type="submit" class="min-h-11 rounded-full px-4 text-sm font-bold text-stone-200 transition hover:bg-white/10 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white/60">Salir</button>
      </form>
    </div>
  </header>
  {% endblock %}

  <main id="contenido" tabindex="-1" class="mx-auto max-w-3xl px-4 pb-16 pt-6 focus:outline-none sm:px-6">
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
